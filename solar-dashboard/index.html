/* ---------- model: weather, prices, consumption ---------- */
const usableCap=dn=>{if(!(S.battKwh>0))return 0;const mn=(S.minSocChanged&&S.oldMinSoc>0&&dn<dnISO(S.minSocChanged))?S.oldMinSoc:S.minSoc;const nb=(S.netbalStart&&dn>=dnISO(S.netbalStart))?(+S.netbalMargin||0):0;return Math.max(0,S.battKwh*(Math.min(100,S.maxSoc)-nb-mn-nb)/100)};

const realDay=dn=>{if(!PR)return null;const d=PR.areas[S.area]||PR.areas.DK2;return d[dn-PR.startDn]||null};

function calibrate(){const t=dnOf(new Date()),sum=new Array(12).fill(0),n=new Array(12).fill(0);
  for(let dn=t-365;dn<t;dn++){const d=realDay(dn);if(!d)continue;const m=dateOf(dn).getUTCMonth();for(const v of d){sum[m]+=v;n[m]++}}
  PR.calib=sum.map((v,m)=>n[m]?(v/n[m])/(SPOT_M[m]*0.95):1)}
const DIM=[31,28.25,31,30,31,30,31,31,30,31,30,31];
const YIELD=[18,38,75,115,140,142,140,118,84,48,21,12];        // kWh pr. kWp pr. måned (DK)

const DAYLEN=[7.6,9.6,11.8,14.1,16.2,17.4,16.9,15,12.7,10.3,8.1,7];
const SPOT_M=[0.92,0.82,0.68,0.55,0.46,0.44,0.50,0.56,0.66,0.76,0.88,0.95]; // DKK/kWh spot-niveau 2026
const YEARF={2024:0.95,2025:1.0,2026:1.0};
const PSHAPE=[0.80,0.76,0.73,0.73,0.76,0.86,1.05,1.25,1.22,1.06,0.96,0.91,0.87,0.86,0.9,1.0,1.15,1.45,1.55,1.36,1.16,1.02,0.93,0.86];
const LSHAPE=(()=>{const a=[0.5,0.45,0.42,0.42,0.45,0.6,0.95,1.25,1.0,0.8,0.75,0.8,0.85,0.8,0.8,0.9,1.15,1.6,1.75,1.55,1.3,1.1,0.85,0.65];const s=a.reduce((x,y)=>x+y);return a.map(v=>v/s)})();
const LSEAS=[1.25,1.2,1.1,0.95,0.85,0.8,0.8,0.82,0.9,1.0,1.15,1.25];
const HEATM=[0.17,0.15,0.13,0.09,0.05,0.025,0.02,0.02,0.035,0.075,0.12,0.15].map(v=>v/1.035); // andel af årets varmebehov pr. måned
const EV_WIN=[17,18,19,20,21,22,23,0,1,2,3,4,5,6];
const elafgift=y=>y<=2024?S.ea2024:y===2025?S.ea2025:y<=2027?S.ea2026:S.ea2028;
function tarif(h,m){const w=m<=2||m>=9;if(h<6)return w?S.tLowW:S.tLowS;if(h>=17&&h<21)return w?S.tPeakW:S.tPeakS;return w?S.tHighW:S.tHighS}

function genDay(dn,installDn){
  const dt=dateOf(dn),m=dt.getUTCMonth(),y=dt.getUTCFullYear(),dow=dt.getUTCDay();
  const r=rng(Math.imul(dn,2654435761)^0x5bd1e995);
  const wind=r(),cloud=r();
  const L=DAYLEN[m],rise=13-L/2;
  const sun=[];let ss=0,smax=0;
  for(let h=0;h<24;h++){const x=(h+0.5-rise)/L;const v=x>0&&x<1?Math.pow(Math.sin(Math.PI*x),1.4):0;sun.push(v);ss+=v;smax=Math.max(smax,v)}
  const clear=0.25+1.3*Math.pow(cloud,0.8);
  const yrs=Math.max(0,(dn-installDn)/365.25);
  const degr=Math.pow(1-S.degradation/100,yrs);
  const pvDay=S.kwp*YIELD[m]/DIM[m]*clear*degr*(S._pvm||1);
  const real=realDay(dn);
  const yf=(PR&&y>=2026?Math.pow(1+S.priceGrowth/100,Math.max(0,y-2026)):(YEARF[y]??Math.pow(1+S.priceGrowth/100,y-2026)))*calib(m);
  const lvl=SPOT_M[m]*yf*(1.45-0.9*wind)*(dow===0||dow===6?0.88:1);
  const ea=elafgift(y);
  const sellFrom=S.sellStart?dnISO(S.sellStart):-1e9;
  const hpKwhDay=(S.hpStart&&S.gasM3>0&&dn>=dnISO(S.hpStart))?S.gasM3*11*0.95/Math.max(1,S.hpScop)*HEATM[m]/DIM[m]:0;
  const loadDay=S.houseKwh/365*LSEAS[m]/1.0075+hpKwhDay;
  const spot=[],buy=[],sell=[],pv=[],load=[];
  for(let h=0;h<24;h++){
    let sp=lvl*PSHAPE[h]-0.55*SUNM[m]*(clear/1.55)*(0.4+wind)*(smax?sun[h]/smax:0)*yf+(r()-0.5)*0.06;
    sp=Math.max(-0.6,sp);if(real)sp=real[h];if(S._pm)sp*=S._pm;
    spot.push(sp);
    buy.push((sp+S.handel+tarif(h,m)+S.energinet+ea)*1.25);
    sell.push(dn<sellFrom?0:sp-S.salgsGebyr);
    pv.push(ss?pvDay*sun[h]/ss:0);
    load.push(loadDay*LSHAPE[h]);
  }
  const evNeed=S.evKm*S.evKwhKm/365*(0.3+1.4*r());
  const aiSmartEV=r()>0.2;            // simuleret: AI'en glemmer smart-opladning ca. hver 5. dag
  return{dn,y,m,dow,spot,buy,sell,pv,load,evNeed,aiSmartEV,ea};
}
function evPlan(day,smart){
  const ev=new Array(24).fill(0);let need=day.evNeed;
  const order=smart?[...EV_WIN].sort((a,b)=>day.buy[a]-day.buy[b]):EV_WIN;
  for(const h of order){if(need<=1e-9)break;const q=Math.min(S.evKw,need);ev[h]=q;need-=q}
  return ev;
}

/* AI-strategi: typisk inverter-logik (egetforbrug + tidsstyret netopladning) */
function simAI(day,soc,cap,detail){
  const ec=Math.sqrt(S.eff/100),ed=ec;
  const ev=evPlan(day,day.aiSmartEV);
  const b=day.buy,mean=b.reduce((x,y)=>x+y)/24;
  const night=[0,1,2,3,4,5].sort((x,y)=>b[x]-b[y]).slice(0,3);
  const pvSum=day.pv.reduce((x,y)=>x+y),cSum=day.load.reduce((x,y)=>x+y)+day.evNeed;
  const gridCharge=!!S.gridCharge&&cap>0&&pvSum<cSum*0.8&&(Math.max(...b)-Math.min(...b))*S.eff/100>0.5;
  const target=cap*0.8;
  const res=acc(detail);
  for(let h=0;h<24;h++){
    const c=day.load[h]+ev[h],net0=day.pv[h]-c;let e=0,imp=0,exp=0;
    if(net0>0){
      const st=Math.min(net0*ec,S.battKw*ec,cap-soc);e=Math.max(0,st);exp=net0-e/ec;
    }else{
      const d=-net0;
      if(soc>1e-6&&b[h]>=mean*0.95&&!(S.noBattForEv&&ev[h]>0)){const sup=Math.min(d,S.battKw,soc*ed);e=-sup/ed;imp=d-sup}
      else if(gridCharge&&night.includes(h)&&soc<target){const st=Math.min(S.battKw*ec,target-soc);e=st;imp=d+st/ec}
      else imp=d;
    }
    soc=Math.min(cap,Math.max(0,soc+e));
    res.add(day,h,c,ev[h],e,soc,imp,exp,0);
  }
  return res.done(soc,ev);
}
/* Optimal plan når batteriet kun må bruge sol og kun dække husets forbrug:
   lad al overskudssol, og brug energien i de dyreste timer, hvor den rækker */
function simOptSelf(day,soc0,cap,detail,ev){
  const ec=Math.sqrt(S.eff/100),ed=ec,res=acc(detail);
  const c=day.load.map((l,h)=>l+ev[h]),ch=new Array(24).fill(0),dis=new Array(24).fill(0),soc=new Array(24);
  let x=soc0;for(let h=0;h<24;h++){const sur=Math.max(0,day.pv[h]-c[h]);const q=Math.min(sur*ec,S.battKw*ec,cap-x);ch[h]=Math.max(0,q);x+=ch[h];soc[h]=x}
  const mean=day.buy.reduce((a,b)=>a+b)/24,term=mean*0.8;
  const order=[...Array(24).keys()].filter(h=>c[h]>day.pv[h]&&day.buy[h]>term&&!(S.noBattForEv&&ev[h]>0)).sort((a,b)=>day.buy[b]-day.buy[a]);
  for(const h of order){let room=Infinity;for(let t=h;t<24;t++)room=Math.min(room,soc[t]);
    const want=Math.min(c[h]-day.pv[h],S.battKw)/ed,take=Math.max(0,Math.min(want,room));if(take<=1e-6)continue;
    dis[h]=take;for(let t=h;t<24;t++)soc[t]-=take}
  for(let h=0;h<24;h++){const e=ch[h]-dis[h];const net=day.pv[h]-c[h]-ch[h]/ec+dis[h]*ed;let imp=0,exp=0,cur=0;
    if(net<0)imp=-net;else if(day.sell[h]<0)cur=net;else exp=net;res.add(day,h,c[h],ev[h],e,soc[h],imp,exp,cur)}
  return res.done(soc[23],ev);
}
/* Optimal plan: dynamisk programmering med kendte døgnpriser */
const planScore=(x,day)=>x.cost-x.soc*(day.buy.reduce((a,b)=>a+b)/24)*Math.sqrt(S.eff/100)*0.8;
function simOpt(day,soc0,cap,detail){
  if(cap<0.2)return simOptDP(day,soc0,cap,detail);
  const g=simOptSelf(day,soc0,cap,detail,evPlan(day,true));
  if(!S.gridCharge&&!S.battToGrid)return g;
  const d=simOptDP(day,soc0,cap,detail);return planScore(g,day)<planScore(d,day)?g:d;
}
function simOptDP(day,soc0,cap,detail){
  const ec=Math.sqrt(S.eff/100),ed=ec;
  const ev=evPlan(day,true);
  const res=acc(detail);
  if(cap<0.2){
    for(let h=0;h<24;h++){const c=day.load[h]+ev[h],net=day.pv[h]-c;let imp=0,exp=0,cur=0;
      if(net<0)imp=-net;else if(day.sell[h]<0)cur=net;else exp=net;res.add(day,h,c,ev[h],0,0,imp,exp,cur)}
    return res.done(0,ev);
  }
  const N=10,st=cap/N,K=Math.max(1,Math.floor(S.battKw/st+1e-9)),W=N+1;
  const mean=day.buy.reduce((x,y)=>x+y)/24,term=mean*ed*0.8;
  const V=new Float64Array(25*W),C=new Int8Array(24*W);
  for(let i=0;i<W;i++)V[24*W+i]=-i*st*term;
  const cs=new Array(24);for(let h=0;h<24;h++)cs[h]=day.load[h]+ev[h];
  for(let h=23;h>=0;h--){
    const pv=day.pv[h],c=cs[h],bu=day.buy[h],se=Math.max(0,day.sell[h]),evh=ev[h];
    for(let i=0;i<W;i++){let best=1e18,bj=i;
      const lo=Math.max(0,i-K),hi=Math.min(N,i+K);
      for(let j=lo;j<=hi;j++){const e=(j-i)*st;if(e<0&&S.noBattForEv&&evh>0)continue;const net=pv-c-(e>0?e/ec:0)+(e<0?-e*ed:0);
        const cr=(e<0&&!S.battToGrid)?Math.min(net,Math.max(0,pv-c)):net;
        const v=(net<0?-net*bu:-cr*se)+V[(h+1)*W+j];if(v<best-1e-12){best=v;bj=j}}
      V[h*W+i]=best;C[h*W+i]=bj}
  }
  let i=Math.min(N,Math.max(0,Math.round(soc0/st)));
  for(let h=0;h<24;h++){
    const j=C[h*W+i],e=(j-i)*st,c=cs[h];
    const net=day.pv[h]-c-(e>0?e/ec:0)+(e<0?-e*ed:0);let imp=0,exp=0,cur=0;
    if(net<0)imp=-net;else if(day.sell[h]<0)cur=net;else{exp=(e<0&&!S.battToGrid)?Math.min(net,Math.max(0,day.pv[h]-c)):net;cur=net-exp}
    i=j;res.add(day,h,c,ev[h],e,i*st,imp,exp,cur);

}
function acc(detail){
  const o={imp:0,exp:0,impCost:0,expRev:0,negLoss:0,self:0,pv:0,cons:0,hours:detail?[]:null};
  o.add=(day,h,c,ev,e,soc,imp,exp,cur)=>{
    o.imp+=imp;o.exp+=exp;o.impCost+=imp*day.buy[h];o.expRev+=exp*day.sell[h];
    if(day.sell[h]<0)o.negLoss+=-exp*day.sell[h];
    o.self+=Math.min(day.pv[h],c)*day.buy[h];o.pv+=day.pv[h];o.cons+=c;
    if(detail)o.hours.push({h,buy:day.buy[h],sell:day.sell[h],spot:day.spot[h],pv:day.pv[h],load:day.load[h],ev,e,soc,imp,exp,cur});
  };
  o.done=(soc,ev)=>{o.soc=soc;o.ev=ev;o.cost=o.impCost-o.expRev;return o};

/* ---------- full simulation ---------- */
let M=null;
function runAll(){
  const d0=dnISO(S.installDate),today=dnOf(new Date()),d1=d0+Math.round(S.years*365.25);
  const end=Math.max(d1,today+1);
  const months=new Map(),daily=[],years=new Map();
  let socA=0,socO=0;const ec=Math.sqrt(S.eff/100);
  const ledger=[];
  const out={d0,d1,today,months,daily,years,ledger,todayDetail:null,tomorrowDetail:null};
  for(let dn=d0;dn<=end;dn++){
    const day=genDay(dn,d0);
    const yrs=(dn-d0)/365.25,cap=usableCap(dn)*(1-S.battDeg/100*yrs);
    const det=dn===today||dn===today+1;
    const a=simAI(day,socA,cap,det);let o=simOpt(day,socO,cap,det);
    if(Math.abs(socA-socO)<0.05&&planScore(a,day)<planScore(o,day))o=a; // den bedste kendte plan er aldrig dårligere end inverterens egen
    const sA0=socA,sO0=socO;socA=a.soc;socO=o.soc;
    const evOptCost=o.ev.reduce((s,q,h)=>s+q*day.buy[h],0),evAiCost=a.ev.reduce((s,q,h)=>s+q*day.buy[h],0);
    let base=0;for(let h=0;h<24;h++)base+=(day.load[h]+o.ev[h])*day.buy[h];
    const sv=day.buy.reduce((x,y)=>x+y)/24*Math.sqrt(S.eff/100)*0.8; // værdi af energi, der står i batteriet
    const gA=base-a.cost+(a.soc-sA0)*sv,gO=base-o.cost+(o.soc-sO0)*sv;
    if(dn<=today){let lb=0,ls=0;for(let h=0;h<24;h++){const c=day.load[h]+a.ev[h],n=day.pv[h]-c;lb+=c*day.buy[h];ls+=n<0?-n*day.buy[h]:-n*day.sell[h]}
      const m=MA&&MA.get(dn);
      ledger.push(m&&m.hours>=20?{dn,base:m.base,sol:m.sol,act:m.act,pv:m.pv,cons:m.cons,imp:m.imp,exp:m.exp,maalt:true}:{dn,base:lb,sol:ls,act:a.cost-(a.soc-sA0)*sv,pv:a.pv,cons:a.cons,imp:a.imp,exp:a.exp})}
    if(det){const d={day,a,o,base,gA,gO,cap};if(dn===today)out.todayDetail=d;else out.tomorrowDetail=d}
    if(dn>d1)continue;
    const key=day.y*12+day.m;let mo=months.get(key);
    if(!mo){mo={y:day.y,m:day.m,key,pv:0,cons:0,imp:0,exp:0,impCost:0,expRev:0,base:0,gA:0,gO:0,self:0,negLoss:0,evExtra:0,buySum:0,sellSum:0,n:0,days:0,past:0};months.set(key,mo)}
    mo.pv+=a.pv;mo.cons+=a.cons;mo.imp+=a.imp;mo.exp+=a.exp;mo.impCost+=a.impCost;mo.expRev+=a.expRev;mo.base+=base;
    mo.gA+=gA;mo.gO+=gO;mo.self+=a.self;mo.negLoss+=a.negLoss;mo.evExtra+=Math.max(0,evAiCost-evOptCost);
    mo.buySum+=day.buy.reduce((x,y)=>x+y);mo.sellSum+=day.sell.reduce((x,y)=>x+y);mo.n+=24;mo.days++;if(dn<=today)mo.past++;
    const yi=Math.floor((dn-d0)/365.25);let yr=years.get(yi);if(!yr){yr={i:yi,gA:0,gO:0};years.set(yi,yr)}yr.gA+=gA;yr.gO+=gO;
    if(dn>today-30&&dn<=today)daily.push({dn,gA,gO,miss:gO-gA,evMiss:Math.max(0,evAiCost-evOptCost),neg:a.negLoss});
  }
  // cumulative net per month
  const list=[...months.values()].sort((p,q)=>p.key-q.key);
  const invKey=(()=>{const d=dateOf(d0+Math.round(S.invYear*365.25));return d.getUTCFullYear()*12+d.getUTCMonth()})();
  // lån: annuitetslån, rente efter fradrag lægges til omkostningerne
  const loan={pmt:0,intTotal:0,intNetTotal:0,balToday:0,intNet12:0};
  if(S.loanAmount>0&&(S.loanPmt>0||S.loanYears>0)){
    // fast ydelse hver måned; renten opsamles og tilskrives ved hvert kalenderkvartal (eller måned) og lægges på gælden
    const ls=S.loanStart?dateOf(dnISO(S.loanStart)):dateOf(d0),lk=ls.getUTCFullYear()*12+ls.getUTCMonth(),r=S.loanRate/1200;
    const comp=Math.max(1,Math.min(12,Math.round(S.loanComp||12))),every=12/comp;
    if(S.loanPmt>0)loan.pmt=S.loanPmt;else{const n=Math.round(S.loanYears*12);loan.pmt=r>0?S.loanAmount*r/(1-Math.pow(1+r,-n)):S.loanAmount/n}
    let bal=S.loanAmount,acc=0;loan.sched=new Map();let k=0;
    while(bal>0.5&&k<720){const key=lk+k;const it=bal*r;acc+=it;
      if(((key%12)+1)%every===0||comp===12){bal+=acc;acc=0}
      const pay=Math.min(loan.pmt,bal+acc);bal-=pay;
      loan.sched.set(key,{it,net:it*(1-S.taxDed/100),pay,bal:Math.max(0,bal)});loan.intTotal+=it;loan.intNetTotal+=it*(1-S.taxDed/100);k++}
    loan.months=k;loan.endKey=lk+k-1;loan.startKey=lk;loan.never=bal>0.5;
  }
  let cA=-S.investment,cO=-S.investment,payA=null,payO=null;
  for(const mo of list){
    if(mo.key===invKey&&S.invYear<S.years){cA-=S.invCost;cO-=S.invCost;mo.inv=S.invCost}
    const ls=loan.sched&&loan.sched.get(mo.key);if(ls){mo.loanInt=ls.net;mo.loanPay=ls.pay;mo.loanBal=ls.bal;cA-=ls.net;cO-=ls.net}
    cA+=mo.gA;cO+=mo.gO;mo.cumA=cA;mo.cumO=cO;
    if(payA===null&&cA>=0)payA=mo;if(payO===null&&cO>=0)payO=mo;
  }
  if(loan.sched){const tk=dateOf(today);const k=tk.getUTCFullYear()*12+tk.getUTCMonth();const cur=loan.sched.get(k);loan.balToday=cur?cur.bal:(k<loan.startKey?S.loanAmount:0);for(let j=k-12;j<k;j++)loan.intNet12+=loan.sched.get(j)?.net||0}
  out.loan=loan;
  out.list=list;out.payA=payA;out.payO=payO;out.finalA=cA;out.finalO=cO;
  const tk=dateOf(today);out.todayKey=tk.getUTCFullYear()*12+tk.getUTCMonth();
  // to date
  let earned=0,last12=0,last12O=0,miss12=0,neg12=0,ev12=0;
  for(let dn=0;dn<0;dn++);
  for(const mo of list){
    if(mo.key<out.todayKey){earned+=mo.gA}
    if(mo.key<out.todayKey&&mo.key>=out.todayKey-12){last12+=mo.gA;last12O+=mo.gO;neg12+=mo.negLoss;ev12+=mo.evExtra}
  }
  const cur=months.get(out.todayKey);if(cur&&cur.days)earned+=cur.gA*cur.past/cur.days;
  out.earned=earned;out.last12=last12;out.last12O=last12O;out.miss12=last12O-last12;out.neg12=neg12;out.ev12=ev12;
  // IRR / NPV on yearly cashflows
  const flows=[-S.investment];for(let i=0;i<S.years;i++){flows.push((years.get(i)?.gA||0)-(i+1===S.invYear&&S.invYear<S.years?S.invCost:0))}
  out.npv=npv(flows,S.discount/100);out.irr=irr(flows);
  const flowsO=[-S.investment];for(let i=0;i<S.years;i++){flowsO.push((years.get(i)?.gO||0)-(i+1===S.invYear&&S.invYear<S.years?S.invCost:0))}
  out.irrO=irr(flowsO);
  // 30-day AI efficiency
  const sA=daily.reduce((s,d)=>s+d.gA,0),sO=daily.reduce((s,d)=>s+d.gO,0);
  out.eff30=sO>0?sA/sO:1;out.miss30=sO-sA;
  out.evaluation=evaluate(out);
  return out;
}
const npv=(f,r)=>f.reduce((s,v,i)=>s+v/Math.pow(1+r,i),0);
function irr(f){let lo=-0.5,hi=0.5;if(npv(f,lo)*npv(f,hi)>0)return null;for(let k=0;k<80;k++){const mid=(lo+hi)/2;if(npv(f,lo)*npv(f,mid)<=0)hi=mid;else lo=mid}return(lo+hi)/2}

/* ---------- AI evaluation: skal du gribe ind? ---------- */
function evaluate(R){
  const issues=[],checks=[];
  const days=[['i dag',R.todayDetail],['i morgen',hasTomorrow()?R.tomorrowDetail:null]].filter(x=>x[1]);
  let gap=0;
  for(const[lbl,D]of days){
    const{a,o,day,cap}=D;const g=Math.max(0,D.gO-D.gA);if(lbl==='i dag')gap=g;
    // bil
    const evA=a.ev.map((q,h)=>q>0?h:-1).filter(h=>h>=0),evO=o.ev.map((q,h)=>q>0?h:-1).filter(h=>h>=0);
    const evDiff=a.ev.reduce((s,q,h)=>s+q*day.buy[h],0)-o.ev.reduce((s,q,h)=>s+q*day.buy[h],0);
    if(evDiff>1&&S.evKm>0)issues.push({sev:evDiff>S.interveneKr?'crit':'warn',key:'ev',when:lbl,
      title:`Bilen lader i dyre timer ${lbl}`,
      text:`Inverteren har planlagt at lade bilen kl. ${ranges(evA)}, hvor strømmen koster op til ${krk(Math.max(...evA.map(h=>day.buy[h])))}. De billigste timer er kl. ${ranges(evO)}.`,
      do:`Sæt ladestart til kl. ${hh(Math.min(...evO.filter(h=>h<12).concat(evO)))} i lade-appen, eller slå "smart opladning" til igen.`,save:evDiff});
    // negative priser
    const negH=a.hours.filter(x=>x.sell<0&&x.exp>0.05);
    if(negH.length){const loss=negH.reduce((s,x)=>s-x.exp*x.sell,0);const kwh=negH.reduce((s,x)=>s+x.exp,0);
      issues.push({sev:loss>S.interveneKr?'crit':'warn',key:'neg',when:lbl,title:`Salg til negativ pris ${lbl}`,
        text:`Kl. ${ranges(negH.map(x=>x.h))} er salgsprisen under nul. Inverteren sender ${nf(kwh,1)} kWh ud og du betaler ${kr(loss,0)} for det.`,
        do:`Sæt eksportgrænsen til 0 kW kl. ${ranges(negH.map(x=>x.h))}, eller lad bilen/batteriet tage strømmen.`,save:loss})}
    // batteri tomt før spidslast
    if(cap>0){const sA=a.hours[16].soc,sO=o.hours[16].soc;const peak=Math.max(...day.buy.slice(17,21));
      if(sA<cap*0.15&&sO>cap*0.4&&peak>1.2*day.buy.reduce((x,y)=>x+y)/24)
        issues.push({sev:'warn',key:'peak',when:lbl,title:`Batteriet er tomt før aftenens dyre timer ${lbl}`,
          text:`Inverteren bruger batteriet i løbet af dagen, så det er ${nf(sA/cap*100)} % fuldt kl. 17. Kl. 17–21 koster strømmen op til ${krk(peak)}. Den optimale plan gemmer ${nf(sO/cap*100)} %.`,
          do:'Sæt en batterireserve på ca. 50 % frem til kl. 17 (tidsstyret afladning) i inverterens app.',save:null})}
  }
  // samlet afvigelse i dag, når den ikke er forklaret af et konkret punkt
  if(R.todayDetail&&gap>S.interveneKr&&!issues.some(i=>i.when==='i dag'&&i.sev==='crit')){
    const D=R.todayDetail,A=D.a.hours,O=D.o.hours;
    const gc=hs=>hs.filter(x=>x.e>0.05&&x.pv<0.05).reduce((s,x)=>s+x.e,0);
    const gA=gc(A),gO=gc(O),gHours=O.filter(x=>x.e>0.05&&x.pv<0.05).map(x=>x.h);
    const b2g=O.filter(x=>x.e<-0.05&&x.exp>0.05),b2gK=b2g.reduce((s,x)=>s+x.exp,0),b2gA=A.filter(x=>x.e<-0.05&&x.exp>0.05).reduce((s,x)=>s+x.exp,0);
    const pk=hs=>hs.filter(x=>x.h>=17&&x.h<21).reduce((s,x)=>s+Math.max(0,-x.e),0),pA=pk(A),pO=pk(O);
    const why=[],todo=[];
    if(gO>gA+0.5){why.push(`den optimale plan lader ${nf(gO,1)} kWh fra nettet om natten, inverteren kun ${nf(gA,1)} kWh`);todo.push(`lad batteriet helt op fra nettet kl. ${ranges(gHours)}`)}
    if(b2gK>b2gA+0.3){why.push(`den optimale plan sælger ${nf(b2gK,1)} kWh fra batteriet kl. ${ranges(b2g.map(x=>x.h))}, hvor salgsprisen er op til ${krk(Math.max(...b2g.map(x=>x.sell)))}`);todo.push('slå "batteri til net" til i de dyreste timer')}
    if(pO>pA+0.5){why.push(`kl. 17–21 bruger den optimale plan ${nf(pO,1)} kWh fra batteriet, inverteren ${nf(pA,1)} kWh`);todo.push('gem mere batteri til kl. 17–21')}
    issues.push({sev:'crit',key:'gap',when:'i dag',title:'Batteriet bruges ikke optimalt i dag',
      text:`Med dagens priser er inverterens plan ${kr(gap)} dyrere end den optimale${why.length?': '+why.join('; '):''}.`,
      do:todo.length?todo.join(', og ').replace(/^./,c=>c.toUpperCase())+' (tidsstyring i SunMate- eller Solplanet-appen).':'Tjek at SunMate står i spotpris-optimering for dit prisområde.',save:gap});
  }
  // 30 dage
  const eff=R.eff30;
  if(eff<0.85)issues.push({sev:'warn',key:'eff',when:'30 dage',title:'AI\'en henter for lidt af den mulige gevinst',
    text:`De sidste 30 dage har AI-styringen hentet ${nf(eff*100)} % af den gevinst, en optimal plan ville have givet. Det svarer til ${kr(R.miss30)} mistet.`,
    do:'Gennemgå inverterens driftsmodus (fx "tidsstyret" eller "spotpris-optimering") og tjek at prisområdet er sat rigtigt.',save:R.miss30});
  const D=R.todayDetail;
  const evOk=!issues.some(i=>i.key==='ev'),negOk=!issues.some(i=>i.key==='neg'),peakOk=!issues.some(i=>i.key==='peak');
  checks.push({ok:evOk,t:'Bilen lader i de billigste timer',d:evOk?'Ladeplanen følger de billigste timer.':'Ladeplanen ligger i dyre timer. Se ovenfor.'});
  checks.push({ok:negOk,t:'Ingen salg til negative priser',d:negOk?'Der er ingen eksport i timer med negativ salgspris.':'Der sælges strøm i timer, hvor du betaler for at levere.'});
  checks.push({ok:peakOk,t:'Batteriet gemmes til spidslast (17–21)',d:peakOk?'Der er energi i batteriet, når nettariffen er højest.':'Batteriet er tømt før de dyreste timer.'});
  let gridBad=false;if(D&&D.cap>0){const hs=D.a.hours;const gc=hs.filter(x=>x.e>0&&x.imp>0&&x.pv<0.05);
    if(gc.length){const avgC=gc.reduce((s,x)=>s+x.buy,0)/gc.length;const later=Math.max(...hs.slice(gc[gc.length-1].h+1).map(x=>x.buy),0);gridBad=later*S.eff/100-avgC<0.1}}
  checks.push({ok:!gridBad,t:'Opladning fra nettet kun når det betaler sig',d:gridBad?'Prisforskellen dækker ikke batteriets tab. Opladningen fra nettet koster mere, end den sparer.':'Opladning fra nettet sker kun ved tilstrækkelig prisforskel, eller sker ikke.'});
  checks.push({ok:eff>=0.9,warn:eff>=0.85&&eff<0.9,t:'AI-effektivitet de sidste 30 dage ≥ 90 %',d:`Målt: ${nf(eff*100)} % af den optimale gevinst.`});
  const crit=issues.some(i=>i.sev==='crit')||gap>S.interveneKr;
  const status=crit?'intervene':(issues.length||eff<0.9)?'watch':'auto';
  return{issues,checks,status,gap,eff};
}

/* ---------- charts ---------- */
function niceTicks(min,max,n=5){if(min===max){max=min+1}const span=max-min;const raw=span/n;const p=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/p;const step=(f<1.5?1:f<3?2:f<7?5:10)*p;const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step;const t=[];for(let v=lo;v<=hi+step/2;v+=step)t.push(+v.toFixed(10));return t}
function chartFrame(el,height){const W=Math.max(260,el.clientWidth||600);return{W,H:height}}
function attachTip(el,svgW,n,xOf,render,onHover){
  const tip=document.createElement('div');tip.className='tip';tip.hidden=true;el.appendChild(tip);
  const svg=el.querySelector('svg');const cross=svg.querySelector('.cross');
  const move=ev=>{const r=svg.getBoundingClientRect();const px=(ev.clientX-r.left)*svgW/r.width;
    let best=0,bd=1e9;for(let i=0;i<n;i++){const d=Math.abs(xOf(i)-px);if(d<bd){bd=d;best=i}}
    tip.innerHTML=render(best);tip.hidden=false;
    const x=xOf(best)*r.width/svgW;const tw=tip.offsetWidth;let left=x+12;if(left+tw>r.width)left=x-tw-12;if(left<0)left=0;
    tip.style.left=left+'px';tip.style.top='4px';
    if(cross){cross.setAttribute('x1',xOf(best));cross.setAttribute('x2',xOf(best));cross.style.display=''}
    onHover&&onHover(best)};
  svg.addEventListener('pointermove',move);svg.addEventListener('pointerdown',move);
  svg.addEventListener('pointerleave',()=>{tip.hidden=true;if(cross)cross.style.display='none';onHover&&onHover(null)});
}
/* line chart. opts: labels, series[{name,values,color,dash,area}], yFmt, band, height, xTick(i)->label|null, markers[{i,label}], zero, strip */
function lineChart(el,o){
  el.innerHTML='';const{W}=chartFrame(el);const stripH=o.strip?o.strip.length*16+6:0;const H=(o.height||220)+stripH;
  const m={l:46,r:10,t:16,b:24+stripH};const n=o.labels.length;
  let mn=Infinity,mx=-Infinity;for(const s of o.series)for(const v of s.values){if(v==null)continue;mn=Math.min(mn,v);mx=Math.max(mx,v)}
  if(o.zero){mn=Math.min(mn,0);mx=Math.max(mx,0)}
  const ticks=niceTicks(mn,mx,4);const y0=ticks[0],y1=ticks[ticks.length-1];
  const pw=W-m.l-m.r,ph=H-m.t-m.b;
  const bw=pw/n;const xOf=o.band?i=>m.l+(i+0.5)*bw:i=>m.l+(n<2?0:i*pw/(n-1));
  const yOf=v=>m.t+ph-(v-y0)/(y1-y0)*ph;
  let s=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(o.aria||'')}">`;
  for(const t of ticks){s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${yOf(t)}" y2="${yOf(t)}" style="stroke:var(${t===0&&o.zero?'--ink-2':'--grid'})" stroke-width="1"/><text x="${m.l-6}" y="${yOf(t)+4}" text-anchor="end">${esc(o.yFmt?o.yFmt(t):nf(t))}</text>`}
  if(o.shade)for(const[a,b,lab]of o.shade){const x1=o.band?m.l+a*bw:xOf(a),x2=o.band?m.l+(b+1)*bw:xOf(b);s+=`<rect x="${x1}" y="${m.t}" width="${Math.max(0,x2-x1)}" height="${ph}" style="fill:var(--surface-2)"/>${lab?`<text x="${(x1+x2)/2}" y="${m.t-4}" text-anchor="middle">${esc(lab)}</text>`:''}`}
  for(let i=0;i<n;i++){const l=o.xTick?o.xTick(i):null;if(l!=null)s+=`<text x="${xOf(i)}" y="${m.t+ph+16}" text-anchor="middle">${esc(l)}</text>`}
  for(const mk of (o.markers||[])){const x=xOf(mk.i);s+=`<line x1="${x}" x2="${x}" y1="${m.t-2}" y2="${m.t+ph}" style="stroke:var(--ink-2)" stroke-dasharray="3 3"/><text x="${Math.min(W-m.r-2,Math.max(m.l,x+4))}" y="${m.t+8}" text-anchor="${x>W*0.75?'end':'start'}" style="fill:var(--ink);font-weight:600">${esc(mk.label)}</text>`}
  for(const se of o.series){let d='';let started=false;se.values.forEach((v,i)=>{if(v==null){started=false;return}d+=(started?'L':'M')+xOf(i).toFixed(1)+' '+yOf(v).toFixed(1);started=true});
    if(se.area){const base=yOf(Math.max(y0,0));s+=`<path d="${d}L${xOf(n-1)} ${base}L${xOf(0)} ${base}Z" style="fill:var(${se.color});opacity:.12"/>`}
    s+=`<path d="${d}" fill="none" style="stroke:var(${se.color})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${se.dash?'stroke-dasharray="5 4"':''}/>`;
    if(se.endDot){const i=se.values.length-1;s+=`<circle cx="${xOf(i)}" cy="${yOf(se.values[i])}" r="4" style="fill:var(${se.color});stroke:var(--surface)" stroke-width="2"/>`}}
  for(const p of (o.points||[])){s+=`<circle cx="${xOf(p.i)}" cy="${yOf(p.v)}" r="5" style="fill:var(${p.color});stroke:var(--surface)" stroke-width="2"/>`}
  if(o.strip){o.strip.forEach((row,k)=>{const yy=m.t+ph+26+k*16;s+=`<text x="${m.l-6}" y="${yy+9}" text-anchor="end">${esc(row.name)}</text>`;
    row.values.forEach((v,i)=>{if(!v)return;s+=`<rect x="${m.l+i*bw+1}" y="${yy}" width="${Math.max(1,bw-2)}" height="12" rx="2" style="fill:var(${v.color});opacity:${v.op??1}"/>`})})}
  s+=`<line class="cross" x1="0" x2="0" y1="${m.t}" y2="${m.t+ph}" style="stroke:var(--ink-2);display:none" stroke-width="1"/>`;
  s+=`<rect x="${m.l}" y="0" width="${pw}" height="${H}" fill="transparent"/></svg>`;
  el.insertAdjacentHTML('beforeend',s);
  if(o.tip)attachTip(el,W,n,xOf,o.tip,o.onHover);
}
/* bar chart with stacks (supports negatives) */
function barChart(el,o){
  el.innerHTML='';const{W}=chartFrame(el);const H=o.height||200;const m={l:52,r:10,t:12,b:24};const n=o.labels.length;
  let mn=0,mx=0;for(let i=0;i<n;i++){let p=0,q=0;for(const s of o.stacks){const v=s.values[i]||0;if(v>=0)p+=v;else q+=v}mx=Math.max(mx,p);mn=Math.min(mn,q)}
  if(o.ref!=null){mx=Math.max(mx,o.ref)}

  const yOf=v=>m.t+ph-(v-y0)/(y1-y0)*ph;const xOf=i=>m.l+(i+0.5)*bw;
  let s=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(o.aria||'')}">`;
  for(const t of ticks)s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${yOf(t)}" y2="${yOf(t)}" style="stroke:var(${t===0?'--ink-2':'--grid'})"/><text x="${m.l-6}" y="${yOf(t)+4}" text-anchor="end">${esc(o.yFmt?o.yFmt(t):nf(t))}</text>`;
  s+=`<line class="cross" x1="0" x2="0" y1="${m.t}" y2="${m.t+ph}" style="stroke:var(--surface-2);display:none" stroke-width="${bw}"/>`;

      s+=top?`<path d="${roundTop(x,yA,w,hgt)}" style="fill:var(${z.st.color});opacity:${o.dim&&o.dim(i)?.45:1}"/>`:`<rect x="${x}" y="${yA}" width="${w}" height="${hgt}" style="fill:var(${z.st.color});opacity:${o.dim&&o.dim(i)?.45:1}"/>`});
    neg.forEach(z=>{const yA=yOf(q),yB=yOf(q+z.v);q+=z.v;s+=`<rect x="${x}" y="${yA}" width="${w}" height="${Math.max(0,yB-yA)}" style="fill:var(${z.st.color});opacity:${o.dim&&o.dim(i)?.45:1}"/>`});
    const l=o.xTick?o.xTick(i):o.labels[i];if(l!=null)s+=`<text x="${xOf(i)}" y="${m.t+ph+16}" text-anchor="middle">${esc(l)}</text>`}
  if(o.ref!=null)s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${yOf(o.ref)}" y2="${yOf(o.ref)}" style="stroke:var(--ink)" stroke-dasharray="4 3"/><text x="${W-m.r}" y="${yOf(o.ref)-4}" text-anchor="end" style="fill:var(--ink)">${esc(o.refLabel||'')}</text>`;
  s+=`<rect x="${m.l}" y="0" width="${pw}" height="${H}" fill="transparent" style="cursor:${o.onClick?'pointer':'default'}"/></svg>`;
  el.insertAdjacentHTML('beforeend',s);
  if(o.tip)attachTip(el,W,n,xOf,o.tip);
  if(o.onClick){const svg=el.querySelector('svg');svg.addEventListener('click',ev=>{const r=svg.getBoundingClientRect();const px=(ev.clientX-r.left)*W/r.width;const i=Math.floor((px-m.l)/bw);if(i>=0&&i<n)o.onClick(i)})}
}
function roundTop(x,y,w,h){const r=Math.min(4,w/2,h);return`M${x} ${y+h}V${y+r}Q${x} ${y} ${x+r} ${y}H${x+w-r}Q${x+w} ${y} ${x+w} ${y+r}V${y+h}Z`}

function issueHTML(i){return`<div class="issue ${i.sev}"><div><h3>${esc(i.title)} <span class="pill ${i.sev}">${i.sev==='crit'?'Grib ind':'Hold øje'}</span>${i.save?`<span class="pill info">${kr(i.save)}</span>`:''}</h3><p>${esc(i.text)}</p><p class="do">${esc(i.do)}</p></div></div>`}
function drawPriceChart(el,height,onHover){
  const W=hourWindow(),hs=W.ai,nowH=new Date().getHours();
  lineChart(el,{labels:hs.map(x=>x.h),band:true,height,yFmt:v=>nf(v,1),aria:'Køb- og salgspris pr. time',
    series:[{name:'Købspris',color:'--s-buy',values:hs.map(x=>x.buy)},{name:'Salgspris',color:'--s-sell',values:hs.map(x=>x.sell)}],zero:true,
    xTick:i=>hs[i].h%(W.two?6:3)===0?hh(hs[i].h):null,
    shade:W.two?[[24,47,'i morgen']]:null,
    markers:[{i:nowH,label:'Nu'}],
    strip:[{name:'Batteri',values:hs.map(x=>actionOf(x))},{name:'Bil',values:hs.map(x=>x.ev>0?{c:'--s-car'}:null)}].map(r=>({name:r.name,values:r.values.map(v=>v?{color:v.c,op:v.op}:null)})),
    tip:i=>{const x=hs[i],a=actionOf(x);return tipRows(`Kl. ${hh(x.h)}–${hh((x.h+1)%24)} ${x.d}`,[['--s-buy','Købspris',krk(x.buy)],['--s-sell','Salgspris',krk(x.sell)],['--s-sun','Sol',nf(x.pv,1)+' kWh'],['--s-batt','Batteri',a?a.l:'Hviler'],['--s-car','Bil',x.ev>0?nf(x.ev,1)+' kWh':'–']])},onHover});
}

let selYear=null,selMonth=null;
function renderEconomy(){
  const v=$('#v-okonomi');const d0=dateOf(R.d0);const y0=d0.getUTCFullYear();const yNow=dateOf(R.today).getUTCFullYear();
  if(selYear==null)selYear=yNow;
  const years=[];for(let y=y0;y<=Math.min(yNow+1,dateOf(R.d1).getUTCFullYear());y++)years.push(y);
  const payA=R.payA,payO=R.payO;
  const lifeGain=R.list.reduce((s,mo)=>s+mo.gA,0);
  v.innerHTML=`
  <div class="panel">
    <div class="panel-head"><h2>Business case</h2><p>Investering ${kr(S.investment)} · start ${fmtDate(R.d0)} · ${S.years} års levetid</p></div>
    ${Array.isArray(S.costItems)&&S.costItems.length?`<div class="tscroll" style="margin-bottom:12px"><table><thead><tr><th>Investeringen fordelt</th><th>Beløb</th></tr></thead><tbody>${S.costItems.map(([n,b])=>`<tr><td class="txt">${esc(n)}</td><td class="${b<0?'pos':''}">${kr(b)}</td></tr>`).join('')}</tbody><tfoot><tr><td class="txt">I alt</td><td>${kr(S.costItems.reduce((a,x)=>a+(+x[1]||0),0))}</td></tr></tfoot></table></div>`:''}
    <div class="facts">
      <div><div class="l">Tjent ind indtil nu</div><div class="v">${kr(R.earned)}</div><div class="h">Mangler ${kr(Math.max(0,S.investment-R.earned))}</div></div>
      <div><div class="l">Tilbagebetalt (nuværende AI)</div><div class="v">${payA?fmtMonth(payA.y,payA.m):'Ikke inden for '+S.years+' år'}</div><div class="h">${payA?nf((payA.key-(y0*12+d0.getUTCMonth()))/12,1)+' år':''}</div></div>
      <div><div class="l">Tilbagebetalt (optimal styring)</div><div class="v">${payO?fmtMonth(payO.y,payO.m):'–'}</div><div class="h">${payA&&payO?`${nf((payA.key-payO.key))} mdr. tidligere`:''}</div></div>
      <div><div class="l">Overskud efter ${S.years} år</div><div class="v" style="color:var(${R.finalA>0?'--good-ink':'--crit-ink'})">${kr(R.finalA)}</div><div class="h">Samlet gevinst ${kr(lifeGain)}${S.invYear<S.years?` − ny inverter ${kr(S.invCost)}`:''}${R.loan.pmt?` − renter efter fradrag ${kr(R.loan.intNetTotal)}`:''}</div></div>
      ${R.loan.pmt?`<div><div class="l">Lån: ydelse pr. måned</div><div class="v">${kr(R.loan.pmt)}</div><div class="h">Anlægget tjente i snit ${kr(R.last12/12)} pr. md. de sidste 12 mdr. · <span class="pill ${R.last12/12>=R.loan.pmt?'good':'warn'}">${R.last12/12>=R.loan.pmt?'Dækker ydelsen':`Dækker ${nf(R.last12/12/R.loan.pmt*100)} %`}</span></div></div>
      <div><div class="l">Lån: restgæld i dag</div><div class="v">${kr(R.loan.balToday)}</div><div class="h">${kr(S.loanAmount)} til ${nf(S.loanRate,2)} % (variabel) · ${R.loan.never?'<span class="pill crit">Ydelsen dækker ikke renten</span>':`færdigbetalt ${fmtMonth(Math.floor(R.loan.endKey/12),R.loan.endKey%12)} (${nf(R.loan.months/12,1)} år)`} · renter i alt ${kr(R.loan.intTotal)} (${kr(R.loan.intNetTotal)} efter fradrag)</div></div>`:''}
      <div><div class="l">Forrentning (IRR)</div><div class="v">${R.irr!=null?nf(R.irr*100,1)+' %':'–'}</div><div class="h">Mod alternativ rente ${nf(S.discount,1)} % · ${R.irr!=null&&R.irr*100>S.discount?'<span class="pill good">Bedre</span>':'<span class="pill crit">Dårligere</span>'}</div></div>
      <div><div class="l">Nutidsværdi</div><div class="v">${kr(R.npv)}</div><div class="h">Diskonteret med ${nf(S.discount,1)} %. Over 0 betyder at det kan betale sig</div></div>
    </div>
  </div>
  <div class="panel">
    <div class="panel-head"><h2>Hvornår er anlægget betalt tilbage?</h2><p>Akkumuleret resultat efter investering${R.loan.pmt?' og renter':''}. Over 0 = tjent hjem</p></div>
    ${legend([['--accent','Med nuværende AI-styring',1],['--s-opt','Hvis styringen var optimal',1]])}
    <div class="chart" id="ecCum"></div>
    <details><summary>Hvordan er det regnet?</summary><div class="prose small">
      <p>Gevinsten er forskellen mellem hvad strømmen ville have kostet uden anlæg, og hvad du faktisk betaler for køb minus hvad du får for salg. Uden anlæg antages bilen stadig at lade om natten i de billigste timer, så gevinsten ikke pustes op.</p>
      <p>Købspris = (spotpris + elhandlerens tillæg + nettarif + Energinet-tarif + elafgift) × 1,25 moms. Salgspris = spotpris − salgsgebyr.</p>
      <p>Elafgiften er sat ned til ${krk(S.ea2026,3)} i 2026–2027. Det gør strøm du selv bruger mindre værd og forlænger tilbagebetalingstiden. Fra 2028 regnes med ${krk(S.ea2028,3)}. Ret det under <a href="#indstillinger">Mit anlæg</a>.</p>
      <p>Fremtiden regnes med ${nf(S.priceGrowth,1)} % årlig elprisstigning, ${nf(S.degradation,1)} % årligt tab i panelerne, ${nf(S.battDeg,1)} % årligt kapacitetstab i batteriet${S.invYear<S.years?` og en ny inverter efter ${S.invYear} år`:''}.</p>
      <p>${R.loan.pmt?`Lånet regnes med ${S.loanPmt>0?`fast ydelse på ${kr(S.loanPmt)} pr. måned`:'annuitetsydelse'} og ${nf(S.loanComp)} rentetilskrivninger om året. Renten er variabel, så ret den under Mit anlæg, når banken ændrer den. Afdragene er en del af investeringen, som allerede er trukket fra. Renterne er en ekstra omkostning og trækkes fra med ${nf(100-S.taxDed)} % efter rentefradrag, så anlægget først er betalt tilbage, når gevinsten også har dækket renterne. Forrentningen (IRR) gælder selve investeringen, før lånet.`:'Der er ikke lagt et lån ind. Har du lånt til anlægget, så skriv lånet ind under <a href="#indstillinger">Mit anlæg</a>.'}</p>
    </div></details>
  </div>
  <div class="panel">
    <div class="panel-head"><h2>Måned for måned</h2><div class="chips" role="group" aria-label="Vælg år">${years.map(y=>`<button class="chip" type="button" data-y="${y}" aria-pressed="${y===selYear}">${y}</button>`).join('')}</div></div>
    ${legend([['--s-sun','Egetforbrug af sol'],['--s-sell','Salg af strøm'],['--s-batt','Batteri og styring'],['--crit','Tab']])}
    <div class="chart" id="ecYear"></div>
    <div class="tscroll" style="margin-top:12px"><table id="ecTable"></table></div>
    <p class="small muted">Tab = salg i timer med negativ pris + ekstra udgift når bilen lader i dyre timer. "Mistet" = forskel til optimal styring. Fremtidige måneder er en prognose.</p>
  </div>`;
  const L=R.list;const startK=y0*12+d0.getUTCMonth();
  const todayIdx=L.findIndex(mo=>mo.key===R.todayKey);
  const mk=[];if(todayIdx>=0)mk.push({i:todayIdx,label:'I dag'});
  const pts=[];if(payA)pts.push({i:L.indexOf(payA),v:payA.cumA,color:'--accent'});
  lineChart($('#ecCum'),{labels:L.map(mo=>mo.key),height:260,zero:true,yFmt:v=>nf(v/1000)+'k',aria:'Akkumuleret resultat',
    series:[{name:'AI',color:'--accent',values:L.map(mo=>mo.cumA),area:true,endDot:true},{name:'Opt',color:'--s-opt',values:L.map(mo=>mo.cumO),dash:true}],
    xTick:i=>L[i].m===0&&(L[i].y-y0)%(L.length>200?5:2)===0?String(L[i].y):null,markers:mk,points:pts,
    tip:i=>{const mo=L[i];return tipRows(fmtMonth(mo.y,mo.m)+(mo.key>R.todayKey?' (prognose)':''),[['--accent','Nuværende AI',kr(mo.cumA)],['--s-opt','Optimal',kr(mo.cumO)],['','Gevinst i måneden',kr(mo.gA)]].concat(mo.loanInt?[['','Renter efter fradrag','−'+kr(mo.loanInt)]]:[]).concat(mo.inv?[['','Ny inverter','−'+kr(mo.inv)]]:[]))}});
  v.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{selYear=+b.dataset.y;selMonth=null;renderEconomy()}));
  const Y=L.filter(mo=>mo.y===selYear);
  barChart($('#ecYear'),{labels:Y.map(mo=>MON[mo.m]),height:220,aria:'Gevinst pr. måned',dim:i=>Y[i].key>R.todayKey,
    stacks:[{color:'--s-sun',values:Y.map(mo=>mo.self)},{color:'--s-sell',values:Y.map(mo=>mo.expRev)},{color:'--s-batt',values:Y.map(mo=>mo.gA-mo.self-mo.expRev)},{color:'--crit',values:Y.map(mo=>-(mo.negLoss+mo.evExtra))}],
    tip:i=>{const mo=Y[i];return tipRows(fmtMonth(mo.y,mo.m)+(mo.key>R.todayKey?' (prognose)':''),[['--s-sun','Egetforbrug',kr(mo.self)],['--s-sell','Salg',kr(mo.expRev)],['--s-batt','Batteri & styring',kr(mo.gA-mo.self-mo.expRev)],['--crit','Tab',kr(mo.negLoss+mo.evExtra)],['','Gevinst',kr(mo.gA)]])},
    onClick:i=>{selMonth=Y[i].key;renderEconomy()}});
  const T=$('#ecTable');let tot={pv:0,imp:0,exp:0,impCost:0,expRev:0,gA:0,loss:0,miss:0};
  T.innerHTML=`<thead><tr><th>Måned</th><th>Sol kWh</th><th>Købt kWh</th><th>Solgt kWh</th><th>Købt for</th><th>Solgt for</th><th>Gevinst</th><th>Tab</th><th>Mistet</th></tr></thead><tbody>${Y.map(mo=>{const loss=mo.negLoss+mo.evExtra;
    tot.pv+=mo.pv;tot.imp+=mo.imp;tot.exp+=mo.exp;tot.impCost+=mo.impCost;tot.expRev+=mo.expRev;tot.gA+=mo.gA;tot.loss+=loss;tot.miss+=mo.gO-mo.gA;
    return`<tr class="${mo.key===selMonth||(selMonth==null&&mo.key===R.todayKey)?'now':''}"><td class="txt">${MONL[mo.m]}${mo.key>R.todayKey?' <span class="pill info">prognose</span>':''}</td><td>${nf(mo.pv)}</td><td>${nf(mo.imp)}</td><td>${nf(mo.exp)}</td><td>${kr(mo.impCost)}</td><td>${kr(mo.expRev)}</td><td class="pos">${kr(mo.gA)}</td><td class="${loss>0.5?'neg':''}">${kr(loss)}</td><td>${kr(mo.gO-mo.gA)}</td></tr>`}).join('')}</tbody>
    <tfoot><tr><td class="txt">I alt ${selYear}</td><td>${nf(tot.pv)}</td><td>${nf(tot.imp)}</td><td>${nf(tot.exp)}</td><td>${kr(tot.impCost)}</td><td>${kr(tot.expRev)}</td><td>${kr(tot.gA)}</td><td>${kr(tot.loss)}</td><td>${kr(tot.miss)}</td></tr></tfoot>`;
}

let HX=null,hxKey='';
function heatData(){
  const key=JSON.stringify(S)+R.today;if(HX&&hxKey===key)return HX;
  const r=S.discount/100,on='2000-01-01';
  const kwhOf=scop=>S.gasM3*11*0.95/Math.max(1,scop);
  const run=pm=>{const o=pm===1?{}:{_pm:pm};
    const b0=scenarioBill({hpStart:'',...o}),bA=scenarioBill({hpStart:on,...o}),bG=scenarioBill({hpStart:on,hpScop:S.groundScop,...o});
    return{elA:bA.bill-b0.bill,elG:bG.bill-b0.bill,elAnoSol:bA.base-b0.base,elGnoSol:bG.base-b0.base}};
  const gasYear=gm=>S.evidaFixed+(+S.gasAbon||0)+S.gasM3*(S.evidaVar+S.gasSupplier*gm)+S.boilerService;
  const capA=annuity(Math.max(0,S.airCost-S.hpGrant),S.airLife,r),capG=annuity(Math.max(0,S.groundCost-S.hpGrant),S.groundLife,r);
  const base=run(1);
  const sens=[0.7,1,1.3].map(pm=>{const x=pm===1?base:run(pm);return[0.7,1,1.3].map(gm=>({pm,gm,gas:gasYear(gm),A:capA+x.elA+S.hpService,G:capG+x.elG+S.hpService}))});
  HX={kwhA:kwhOf(S.hpScop),kwhG:kwhOf(S.groundScop),base,gas:gasYear(1),capA,capG,sens};hxKey=key;return HX;
}

function isoWeek(dn){const d=dateOf(dn);const t=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()+3-((d.getUTCDay()+6)%7)));const y1=new Date(Date.UTC(t.getUTCFullYear(),0,4));return[t.getUTCFullYear(),1+Math.round(((t-y1)/864e5-3+((y1.getUTCDay()+6)%7))/7)]}
function ledgerGroups(per){

    if(per==='day'){k=r.dn;l=d.getUTCDate()+'. '+MON[d.getUTCMonth()]+' '+d.getUTCFullYear()}
    else if(per==='week'){const[wy,w]=isoWeek(r.dn);k=wy*100+w;l='Uge '+w+' '+wy}
    else if(per==='month'){k=d.getUTCFullYear()*12+d.getUTCMonth();l=MONL[d.getUTCMonth()]+' '+d.getUTCFullYear()}
    else{k=d.getUTCFullYear();l=String(k)}
    let x=g.get(k);if(!x){x={k,l,base:0,sol:0,act:0,pv:0,cons:0,imp:0,exp:0,days:0};g.set(k,x)}
    x.base+=r.base;x.sol+=r.sol;x.act+=r.act;x.pv+=r.pv;x.cons+=r.cons;x.imp+=r.imp;x.exp+=r.exp;x.days++}
  let L=[...g.values()].sort((a,b)=>a.k-b.k);
  if(per==='day')L=L.slice(-31);if(per==='week')L=L.slice(-26);

/* ---------- udvid anlægget: hvad hver del tjener ---------- */
const LIFE_PV=25,LIFE_BATT=15;
function scenario(over){
  const keep={...S};
  Object.assign(S,over,{sellStart:'',ea2024:keep.ea2028,ea2025:keep.ea2028,ea2026:keep.ea2028});
  const t=dnOf(new Date());let soc=0,gain=0;
  try{for(let dn=t-365;dn<t;dn++){const day=genDay(dn,dn);const cap=usableCap(t);
    const a=simAI(day,soc,cap,false);soc=a.soc;const evO=evPlan(day,true);let base=0;
    for(let h=0;h<24;h++)base+=(day.load[h]+evO[h])*day.buy[h];gain+=base-a.cost}}
  finally{Object.assign(S,keep);delete S._pm;delete S._pvm}
  return gain;
}
function scenarioBill(over){ // faktisk elregning (købt − solgt) sidste 12 mdr. med elafgift som fra 2028
  const keep={...S};Object.assign(S,over,{sellStart:'',ea2024:keep.ea2028,ea2025:keep.ea2028,ea2026:keep.ea2028});
  const t=dnOf(new Date());let soc=0,bill=0,base=0;
  try{for(let dn=t-365;dn<t;dn++){const day=genDay(dn,dn);const a=simAI(day,soc,usableCap(t),false);soc=a.soc;bill+=a.cost;for(let h=0;h<24;h++)base+=(day.load[h]+a.ev[h])*day.buy[h]}}
  finally{Object.assign(S,keep);delete S._pm;delete S._pvm}
  return{bill,base};
}
const annuity=(c,n,r)=>r>0?c*r/(1-Math.pow(1+r,-n)):c/n;
const pvFactor=(n)=>{const r=S.discount/100;return r>0?(1-Math.pow(1+r,-n))/r:n};
let EX=null,exKey='',exHp=false;
const scen=x=>scenario(exHp?{hpStart:'2000-01-01',...x}:{hpStart:'',...x});
function expandData(){
  const key=JSON.stringify(S)+R.today+exHp;if(EX&&exKey===key)return EX;
  const sizes=[0,5,10,15,20,25,30];if(!sizes.includes(S.battKwh))sizes.push(S.battKwh);sizes.sort((a,b)=>a-b);
  const batt=sizes.map(k=>({k,g:scen({battKwh:k})}));
  const base=batt.find(b=>b.k===S.battKwh).g;
  const maxKwp=S.invKw*S.oversize/100;let ks=[-4,0,2,4,6,8].map(d=>+Math.max(0,S.kwp+d).toFixed(2)).filter(k=>k<=maxKwp+1e-9||k<=S.kwp);if(maxKwp>S.kwp+0.05&&!ks.some(k=>Math.abs(k-maxKwp)<0.3))ks.push(+maxKwp.toFixed(2));ks=[...new Set(ks)].sort((a,b)=>a-b);
  const pvs=ks.map(k=>({k,g:k===S.kwp?base:scen({kwp:k})}));
  const noBatt=batt.find(b=>b.k===0).g,noPv=scen({kwp:0});
  EX={batt,pvs,base,noBatt,noPv,maxKwp};exKey=key;return EX;
}
let exBattAdd=5,exBattPrice=30000,exPvAdd=4,exPvPrice=25000;
function renderExpand(){
  const v=$('#v-udvid');
  v.innerHTML=`<div class="panel"><p class="muted">Regner scenarier…</p></div>`;
  setTimeout(()=>{
  const E=expandData();
  const battGain=E.base-E.noBatt,pvGain=E.base-E.noPv;
  const maxBatt=battGain*pvFactor(LIFE_BATT),maxPv=E.noBatt*pvFactor(LIFE_PV);
  v.innerHTML=`
  <div class="panel prose" style="max-width:none">
    <div class="panel-head"><h2>Hvad tjener hver del af anlægget?</h2><p>Gevinst pr. år med elpriserne fra de sidste 12 måneder</p></div>
    <p class="small muted">Regnet med elafgift som fra 2028 (${krk(S.ea2028,3)}), fordi det er den, der gælder det meste af levetiden. Batteriet regnes med ${LIFE_BATT} års levetid og panelerne med ${LIFE_PV} år, diskonteret med ${nf(S.discount,1)} %. Indtægt fra netbalancering er ikke med.</p>
    <div class="row" style="margin:6px 0"><span class="small"><strong>Forbrug:</strong></span><div class="chips" role="group" aria-label="Forbrug"><button class="chip" type="button" data-hp="0" aria-pressed="${!exHp}">Som nu</button><button class="chip" type="button" data-hp="1" aria-pressed="${exHp}" ${S.gasM3>0?'':'disabled'}>Med varmepumpe</button></div><span class="small muted">${S.gasM3>0?`${nf(S.gasM3)} m³ gas om året svarer til ca. ${nf(S.gasM3*11*0.95/S.hpScop)} kWh strøm med en varmepumpe (SCOP ${nf(S.hpScop,1)})`:'Skriv dit gasforbrug under Mit anlæg for at se, hvad en varmepumpe betyder'}</span></div>
    <p class="small"><span class="pill warn">Foreløbigt</span> Produktion og forbrug er simuleret, indtil data fra SunMate eller Solplanet er koblet på. Tallene viser, hvad regnestykket giver under de antagelser. Brug følsomhedstabellerne til at se, om svaret holder, hvis priser eller produktion bliver anderledes.</p>
  </div>
  <div class="facts">
    <div><div class="l">Hele anlægget</div><div class="v">${kr(E.base)} / år</div><div class="h">${nf(S.kwp,1)} kWp og ${nf(S.battKwh,1)} kWh batteri</div></div>
    <div><div class="l">Kun paneler og inverter</div><div class="v">${kr(E.noBatt)} / år</div><div class="h">Uden batteri · må koste op til ${kr(maxPv)} over ${LIFE_PV} år</div></div>
    <div><div class="l">Batteriets bidrag</div><div class="v">${kr(battGain)} / år</div><div class="h">Ekstra gevinst fra batteriet · <strong>må koste op til ${kr(maxBatt)}</strong> for at betale sig over ${LIFE_BATT} år</div></div>
  </div>
  <div class="grid2">
    <div class="panel">
      <div class="panel-head"><h2>Batteriets størrelse</h2><p>Gevinst pr. år ved forskellig batterikapacitet</p></div>
      <div class="chart" id="exBatt"></div>
      <p class="small muted">Hver ekstra kWh giver mindre end den forrige. Når søjlerne flader ud, står det ekstra batteri ofte ubrugt.</p>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Antal solpaneler</h2><p>Gevinst pr. år ved forskellig solcelleeffekt</p></div>
      <div class="chart" id="exPv"></div>
      <p class="small muted">Inverteren på ${nf(S.invKw,1)} kW må have op til ${nf(S.oversize)} % paneler, altså ${nf(E.maxKwp,1)} kWp. Du kan altså udvide med ca. ${nf(Math.max(0,E.maxKwp-S.kwp),1)} kWp uden ny inverter.</p>
    </div>
  </div>
  <div class="panel">
    <div class="panel-head"><h2>Kan en udvidelse betale sig?</h2><p>Skriv størrelse og pris fra et tilbud</p></div>
    <div class="grid2">
      <div class="fields">
        <div class="field"><label for="exBattAdd">Ekstra batteri</label><div class="in"><input id="exBattAdd" type="number" step="0.5" value="${exBattAdd}" inputmode="decimal"><span class="u">kWh</span></div></div>
        <div class="field"><label for="exBattPrice">Pris for batteri inkl. montering</label><div class="in"><input id="exBattPrice" type="number" step="500" value="${exBattPrice}" inputmode="decimal"><span class="u">kr</span></div></div>
        <div id="exBattRes" style="grid-column:1/-1"></div>
      </div>
      <div class="fields">
        <div class="field"><label for="exPvAdd">Ekstra solceller</label><div class="in"><input id="exPvAdd" type="number" step="0.1" value="${exPvAdd}" inputmode="decimal"><span class="u">kWp</span></div></div>
        <div class="field"><label for="exPvPrice">Pris for paneler inkl. montering</label><div class="in"><input id="exPvPrice" type="number" step="500" value="${exPvPrice}" inputmode="decimal"><span class="u">kr</span></div></div>
        <div id="exPvRes" style="grid-column:1/-1"></div>
      </div>
    </div>
  </div>`;
  v.querySelectorAll('[data-hp]').forEach(b=>b.addEventListener('click',()=>{exHp=b.dataset.hp==='1';renderExpand()}));
  const bar=(el,items,cur,unit)=>barChart(el,{labels:items.map(b=>nf(b.k,unit==='kWp'?1:0)),height:210,yFmt:v=>nf(v),aria:'Gevinst pr. år',
    dim:i=>items[i].k!==cur,stacks:[{color:'--accent',values:items.map(b=>b.g)}],xTick:i=>nf(items[i].k,unit==='kWp'?1:0)+' '+unit,
    tip:i=>{const b=items[i],p=items[i-1];return tipRows(`${nf(b.k,1)} ${unit}${b.k===cur?' (dit anlæg)':''}`,[['--accent','Gevinst pr. år',kr(b.g)]].concat(p?[['',`Ekstra fra ${nf(p.k,1)} ${unit}`,kr(b.g-p.g)]]:[]))}});
  bar($('#exBatt'),E.batt,S.battKwh,'kWh');bar($('#exPv'),E.pvs,S.kwp,'kWp');
  const yrsTxt=y=>Number.isFinite(y)&&y<99?nf(y,1)+' år':'over 99 år';
  const verdict=(gain,price,life)=>{const yrs=gain>0?price/gain:Infinity,ok=gain*pvFactor(life)>=price;
    return`<div class="facts" style="margin-top:6px"><div><div class="l">Ekstra gevinst pr. år</div><div class="v">${kr(gain)}</div><div class="h">Med elpriser og produktion som nu</div></div><div><div class="l">Tilbagebetalingstid</div><div class="v">${yrsTxt(yrs)}</div><div class="h"><span class="pill ${ok?'good':'crit'}">${ok?'Tjener sig hjem':'Tjener sig ikke hjem'}</span> inden for ${life} år under disse antagelser</div></div></div>`};
  const PM=[0.7,1,1.3],PVM=[0.8,1,1.2];
  const sens=(over,price,life)=>{const rows=PM.map(pm=>PVM.map(pvm=>{const g=scen({...over,_pm:pm,_pvm:pvm})-scen({_pm:pm,_pvm:pvm});const y=g>0?price/g:Infinity;return{y,ok:g*pvFactor(life)>=price}}));
    return`<div class="tscroll" style="margin-top:10px"><table><thead><tr><th>Spotpris ↓ · produktion →</th>${PVM.map(x=>`<th>${x===1?'Som simuleret':(x<1?'−':'+')+nf(Math.abs(x-1)*100)+' %'}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr><td class="txt">${PM[i]===1?'Som nu':(PM[i]<1?'−':'+')+nf(Math.abs(PM[i]-1)*100)+' % spotpris'}</td>${r.map(c=>`<td><span class="pill ${c.ok?'good':'crit'}">${yrsTxt(c.y)}</span></td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="small muted">Tilbagebetalingstid ved andre elpriser og anden produktion. Grøn = tjener sig hjem inden for ${life} år.</p>`};
  const calc=()=>{
    exBattAdd=+$('#exBattAdd').value||0;exBattPrice=+$('#exBattPrice').value||0;exPvAdd=+$('#exPvAdd').value||0;exPvPrice=+$('#exPvPrice').value||0;
    const oB={battKwh:S.battKwh+exBattAdd},oP={kwp:S.kwp+exPvAdd};
    const gB=scen(oB)-E.base,gP=scen(oP)-E.base;
    $('#exBattRes').innerHTML=verdict(gB,exBattPrice,LIFE_BATT)+sens(oB,exBattPrice,LIFE_BATT);
    $('#exPvRes').innerHTML=verdict(gP,exPvPrice,LIFE_PV)+sens(oP,exPvPrice,LIFE_PV)+(S.kwp+exPvAdd>E.maxKwp+0.01?`<p class="small"><span class="pill warn">! Over inverterens grænse</span> ${nf(S.kwp+exPvAdd,1)} kWp er mere end de ${nf(E.maxKwp,1)} kWp, inverteren må have. Det kræver en større inverter eller en ekstra.</p>`:'')};
  let t;v.querySelectorAll('input').forEach(i=>i.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(calc,300)}));calc();
  },20);
}

function renderSettings(){
  const v=$('#v-indstillinger');
  v.innerHTML=`<div class="panel prose"><h2>Mit anlæg</h2><p>Skriv dine egne tal ind, så regner dashboardet hele business casen om med det samme. Tallene gemmes kun i denne browser.</p>
    <p class="small muted">${S._custom?'Du bruger dine egne tal.':'Felterne er udfyldt med eksempeltal for et typisk dansk parcelhus med 10 kWp, 10 kWh batteri og elbil.'}</p></div>
  <form class="set" id="setForm" novalidate>${FIELDS.map(([g,fs])=>`<fieldset><legend>${esc(g)}</legend><div class="fields">${fs.map(([k,l,u,step,type,hint])=>`<div class="field"><label for="f-${k}">${esc(l)}</label><div class="in"><input id="f-${k}" name="${k}" type="${type||'number'}" ${step?`step="${step}"`:''} value="${esc(S[k])}" ${(type||'number')==='number'?'inputmode="decimal"':''}>${u?`<span class="u">${esc(u)}</span>`:''}</div>${hint?`<span class="hint">${esc(hint)}</span>`:''}</div>`).join('')}</div></fieldset>`).join('')}
  <div class="row"><button class="btn ghost" type="button" id="resetBtn">Nulstil til eksempeltal</button><span class="small muted" id="saveMsg" aria-live="polite"></span></div></form>`;
  let t;
  $('#setForm').addEventListener('input',e=>{const el=e.target;const k=el.name;if(!k)return;
    if(el.type==='number'){const n=parseFloat(el.value);if(!Number.isFinite(n))return;S[k]=n}else{if(!el.value)return;if(k==='area'){const a=el.value.trim().toUpperCase();if(a!=='DK1'&&a!=='DK2')return;S[k]=a}else S[k]=el.value}
    S._custom=true;saveSettings();clearTimeout(t);$('#saveMsg').textContent='Regner om…';
    t=setTimeout(()=>{recompute(false);$('#saveMsg').textContent='Gemt og regnet om'},350)});
  $('#setForm').addEventListener('submit',e=>e.preventDefault());
  $('#resetBtn').addEventListener('click',()=>{S={...DEFAULTS};try{localStorage.removeItem('solcelle-settings')}catch(e){}recompute(true)});
}

/* ---------- routing ---------- */
const VIEWS={varme:renderHeat,regnskab:renderLedger,udvid:renderExpand,overblik:renderOverview,okonomi:renderEconomy,styring:renderControl,priser:renderPrices,indstillinger:renderSettings};
let R=null,current=null;
function route(){
  let h=location.hash.replace('#','');if(!VIEWS[h])h='overblik';current=h;
  for(const k in VIEWS)$('#v-'+k).hidden=k!==h;
  document.querySelectorAll('nav.tabs a').forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')==='#'+h?'page':'false'));
  VIEWS[h]();
}
function recompute(rerender){
  R=runAll();
  $('#plantName').textContent=`${S.name} · ${nf(S.kwp,1)} kWp${S.battKwh>0?` · ${nf(S.battKwh,1)} kWh batteri`:''}`;
  $('#sampleTag').textContent=PR?`Rigtige elpriser ${S.area} · sol og forbrug simuleret`:(S._custom?'Dine tal · simulerede timedata':'Eksempeldata');
  if(rerender||current!=='indstillinger')route();
}
window.addEventListener('hashchange',()=>{route();window.scrollTo(0,0)});
let rw;window.addEventListener('resize',()=>{clearTimeout(rw);rw=setTimeout(()=>{if(current!=='indstillinger')VIEWS[current]()},150)});
recompute(true);
// personlige standardværdier (lån m.m.) ligger i personal.json, som kun udgives med dashboardet og ikke ligger i git
fetch('personal.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(j=>{if(!j||typeof j!=='object')return;for(const k of Object.keys(DEFAULTS))if(k in j)DEFAULTS[k]=j[k];S=loadSettings();recompute(true)}).catch(()=>{});
fetch('maalt.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(j=>{if(!j||!Array.isArray(j.days))return;MA=new Map(j.days.map(x=>[dnISO(x.d),x]));recompute(true)}).catch(()=>{});
fetch('prices.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(j=>{if(!j||!j.areas)return;PR=j;PR.startDn=dnISO(j.start);calibrate();recompute(true)}).catch(()=>{});
</script>
